[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic"
version = "0.1.0"
description = "Macro-MOSAIC experiment harness (MPhil thesis, PolyU DSAI)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
gpu = ["vllm>=0.17", "peft>=0.13", "trl>=0.12", "datasets>=2.20", "accelerate>=0.34"]
api = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
mosaic = "mosaic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
