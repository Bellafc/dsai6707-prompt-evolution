# exp01: is fine-tuning better than prompting? (Confirmation panel question: "why fine-tune instead of CoT?")
# Pre-registration: prereg/exp01_prompt_vs_sft.md. Frozen by `mosaic freeze --exp exp01` before the test run.

prereg = ["prereg/exp01_prompt_vs_sft.md", "prereg/exp01_amendment_1.md", "prereg/exp01_amendment_2.md",
          "prereg/exp01_amendment_3.md"]
# Amendment 4 (draft: research/prereg_drafts/exp01_amendment_4_DRAFT.md) changes the base model because the
# Confirmation's Qwen2.5 adapters were lost. The author registers it (moves it to prereg/ and adds it above)
# before any test-split output of arms A/B/C and before `mosaic freeze`.

[model]
base = "Qwen/Qwen3-8B"         # post-trained Qwen3 (2025-04-29, Apache-2.0); was Qwen/Qwen2.5-7B-Instruct
chat_template_kwargs = { enable_thinking = false }   # non-thinking mode in training and inference (amendment 4)
max_model_len = 16384          # few-shot prompts are long; 24 GB cards may need 12288 (see program.md)
gpu_memory_utilization = 0.90
max_lora_rank = 32             # adapters are trained with r = 32, alpha = 64 (`mosaic train`, amendment 4)
# adapters_dir = "adapters/qwen3-8b"   # default comes from configs/paths*.toml

[sampling]                     # identical for A, B, C (and T); D cannot set sampling (amendment 1)
temperature = 0.7
top_p = 0.9
max_tokens = 2048
seed = 20261030

[arms.A]                       # zero-shot CoT: school system prompt + user template (Confirmation "base")
[arms.B]                       # few-shot CoT: A + k exemplars from the school's SFT trajectories
k = 3                          # tunable on dev only, within the budget in program.md
strategy = "random"            # "random" | "category"
max_chars = 6000               # truncate long exemplar responses
[arms.C]                       # LoRA SFT adapter, same messages as A
[arms.D]                       # frontier reference: Claude Opus 5.5, same messages as A (amendment 1)
provider = "claude_cli"        # `claude -p` on your own login (subscription); no temperature control
model = "claude-opus-5-5"
effort = "medium"              # fixed for every call; recorded in the cache key
timeout_s = 900

[arms.T]                       # optional: GPT-4o, the teacher that generated the SFT data, same messages as A
provider = "openai"
model = "gpt-4o"
usd_per_mtok_in = 2.50         # check current pricing before the final run
usd_per_mtok_out = 10.00
budget_usd = 15.0              # hard stop per run

[report]
comparisons = ["A>B", "A>C", "B>C", "C>D", "A>D", "C>T"]   # "X>Y": Y vs baseline X; missing arms skipped
primary = ["B>C"]                                  # the confirmatory question: SFT vs the strongest prompting
primary_metric = "consistency"
