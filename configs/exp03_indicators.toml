# The 35 FRED indicators of the macro context (exp03 draft, "Information set"; exp02 uses the same panel).
# Source of the first 25: the Confirmation report's description of the 35-indicator snapshot
# (docs/project/confirmation/jft_confirmation_final.txt, "Quantitative layers"), mapped to FRED ids by the agent.
# The last 10 (group "filler") are the agent's guess: the report lists categories, not ids, and the episode
# database export is not in the repository. THE HUMAN MUST COMPARE THIS LIST WITH THE EPISODE DATABASE and replace
# the filler ids with the real ones before registration (research/LOG.md, "For the human").
# freq: m = monthly, q = quarterly, w = weekly, d = daily. Daily/weekly series are shown as of the forecast date.

